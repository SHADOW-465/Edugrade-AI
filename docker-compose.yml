version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  streamlit:
    build:
      context: ./frontend/streamlit
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  nextjs:
    build:
      context: ./frontend/nextjs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
